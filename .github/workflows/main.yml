name: Telegram Auto Reports

on:
  schedule:
    - cron: "1 21 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run reports
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py
